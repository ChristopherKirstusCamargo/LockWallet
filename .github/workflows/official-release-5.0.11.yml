name: Lock Wallet 5.0.11 Official Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-release-5.0.11.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockwallet-official-release-5.0.11
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, verify and publish 5.0.11
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run native bridge tests
        run: cargo test --locked --manifest-path native/privacy-ring/Cargo.toml --lib

      - name: Run Android module and app unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :core:crypto:test \
            :core:solana:test \
            :data:rpc:test \
            :data:price:test \
            :custody:local:testDebugUnitTest \
            :custody:seedvault:testDebugUnitTest \
            :app:testDebugUnitTest

      - name: Generate the new production signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/lockwallet-release.p12"
          PROPS="$RUNNER_TEMP/lockwallet-signing.properties"
          PASSWORD="$(openssl rand -hex 32)"
          umask 077
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias lockwallet-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -dname "CN=Lock Wallet Release"
          {
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$PASSWORD"
            printf 'keyAlias=lockwallet-release\n'
            printf 'keyPassword=%s\n' "$PASSWORD"
            printf 'storeType=PKCS12\n'
          } > "$PROPS"
          echo "LOCKWALLET_SIGNING_PROPS=$PROPS" >> "$GITHUB_ENV"

      - name: Build the production APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:clean \
            :app:assembleRelease \
            -Plockwallet.signingProps="$LOCKWALLET_SIGNING_PROPS"

      - name: Verify production package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "$APK"
          python3 tools/verify_apk_manifest.py --aapt2 "$BUILD_TOOLS/aapt2" --apk "$APK" --release
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='com.lockwallet.app' versionCode='19' versionName='5.0.11'"

      - name: Create encrypted offline signing-key backup
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/lockwallet-release.p12"
          BACKUP_DIR="$RUNNER_TEMP/lockwallet-signing-backup"
          BACKUP_ZIP="$RUNNER_TEMP/lockwallet-signing-backup.zip"
          PROPS_DIR="$RUNNER_TEMP/lockwallet-backup-props"
          mkdir -m 700 -p "$BACKUP_DIR" "$PROPS_DIR"
          cp "$KEYSTORE" "$BACKUP_DIR/lockwallet-release.p12"
          cp "$RUNNER_TEMP/lockwallet-signing.properties" "$PROPS_DIR/signing.properties"
          PASSWORD="$(sed -n 's/^storePassword=//p' "$PROPS_DIR/signing.properties")"
          {
            printf 'storeFile=lockwallet-release.p12\n'
            printf 'storePassword=%s\n' "$PASSWORD"
            printf 'keyAlias=lockwallet-release\n'
            printf 'keyPassword=%s\n' "$PASSWORD"
            printf 'storeType=PKCS12\n'
          } > "$BACKUP_DIR/signing.properties"
          cat > "$BACKUP_DIR/README.txt" <<'EOF'
          Lock Wallet 5.0.11 production signing-key backup.

          Keep this archive encrypted and preserve the separate
          LockWallet-release-recovery-key.pem file offline.
          The recovery PEM is required to decrypt this archive.
          Never commit or publicly share the recovery PEM.
          After decrypting this ZIP, keep lockwallet-release.p12 and
          signing.properties together in a protected offline location.
          EOF
          (cd "$BACKUP_DIR" && zip -q -r "$BACKUP_ZIP" .)
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/pip" install --disable-pip-version-check --no-cache-dir "cryptography==46.0.3"
          mkdir -p dist
          "$RUNNER_TEMP/backup-venv/bin/python" tools/lockwallet_release_backup.py encrypt \
            --certificate tools/lockwallet-release-backup-cert.pem \
            --input "$BACKUP_ZIP" \
            --output dist/LockWallet-5.0.11-signing-backup.enc

      - name: Stage release assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LockWallet-5.0.11.apk
          sha256sum dist/LockWallet-5.0.11.apk > dist/LockWallet-5.0.11.apk.sha256
          test -s dist/LockWallet-5.0.11-signing-backup.enc

      - name: Publish the official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Lock Wallet 5.0.11

          Correção limitada à recuperação de frases BIP-39.

          - Geração continua usando exclusivamente a lista oficial BIP-39 em inglês, com 2.048 palavras, fixada por hash.
          - Restauração normaliza maiúsculas e separadores Unicode sem corrigir silenciosamente letras inválidas.
          - Sugestões locais exibem todas as correspondências da lista a partir de três letras; quatro letras identificam uma palavra de forma única.
          - Sugestões são processadas dentro do aplicativo. O teclado de segredo permanece sem autocomplete externo.
          - Testes de geração, lista, prefixos, normalização, parser e interface executados antes da publicação.
          - APK de produção, manifesto e assinatura verificados; backup da chave de assinatura anexado em formato criptografado.

          **Migração de instalação:** esta versão usa uma nova chave de assinatura Android. Ela não instala por cima da versão 5.0.10. Antes de atualizar, exporte o backup de recuperação da carteira e confirme que consegue restaurá-lo. Só então desinstale a versão anterior, instale a 5.0.11 e restaure a carteira. Não desinstale a versão anterior antes de verificar o backup de recuperação.

          Preserve o backup criptografado da chave de assinatura e a chave offline de recuperação correspondente separadamente.
          EOF
          gh release create v5.0.11 \
            dist/LockWallet-5.0.11.apk \
            dist/LockWallet-5.0.11.apk.sha256 \
            dist/LockWallet-5.0.11-signing-backup.enc \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lock Wallet 5.0.11" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release delete v5.0.11-test.1 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
