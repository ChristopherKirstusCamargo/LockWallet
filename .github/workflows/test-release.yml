name: LockWallet temporary test release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockwallet-test-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-test:
    name: Test APK build and pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run native bridge tests
        run: cargo test --locked --manifest-path native/privacy-ring/Cargo.toml --lib

      - name: Create an ephemeral signing key for this test build
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/lockwallet-test-only.p12"
          PROPS="$RUNNER_TEMP/lockwallet-test-signing.properties"
          PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias lockwallet-test \
            -keyalg RSA \
            -keysize 3072 \
            -validity 30 \
            -dname "CN=LockWallet Temporary Test Build"
          umask 077
          {
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$PASSWORD"
            printf 'keyAlias=lockwallet-test\n'
            printf 'keyPassword=%s\n' "$PASSWORD"
            printf 'storeType=PKCS12\n'
          } > "$PROPS"
          echo "LOCKWALLET_SIGNING_PROPS=$PROPS" >> "$GITHUB_ENV"

      - name: Run module tests and build the signed test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :core:crypto:test \
            :core:solana:test \
            :data:rpc:test \
            :data:price:test \
            :custody:local:testDebugUnitTest \
            :custody:seedvault:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            -Plockwallet.signingProps="$LOCKWALLET_SIGNING_PROPS" \
            -Plockwallet.testBuild=true

      - name: Verify and stage the test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "$APK"
          python3 tools/verify_apk_manifest.py --aapt2 "$BUILD_TOOLS/aapt2" --apk "$APK" --release
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='com.lockwallet.app.test' versionCode='18' versionName='5.0.10'"
          mkdir -p dist
          cp "$APK" dist/LockWallet-5.0.10-test.1.apk
          sha256sum dist/LockWallet-5.0.10-test.1.apk > dist/LockWallet-5.0.10-test.1.apk.sha256

      - name: Preserve the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockWallet-5.0.10-test.1
          path: |
            dist/LockWallet-5.0.10-test.1.apk
            dist/LockWallet-5.0.10-test.1.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v5.0.10-test.1 \
            dist/LockWallet-5.0.10-test.1.apk \
            dist/LockWallet-5.0.10-test.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lock Wallet 5.0.10 — Test build 1" \
            --prerelease \
            --notes "Build temporária para testes, baseada no commit $GITHUB_SHA.

          - Android versionName: 5.0.10
          - Android versionCode: 18
          - Package ID isolado: com.lockwallet.app.test
          - Assinatura temporária gerada apenas durante esta execução e descartada ao final.
          - Esta pré-release não é a atualização oficial da instalação com package ID com.lockwallet.app.
          - Pode ser instalada ao lado da versão principal. Use uma carteira de teste e não importe fundos relevantes."
