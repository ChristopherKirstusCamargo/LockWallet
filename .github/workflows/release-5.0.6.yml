name: Publish release 5.0.6 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-5.0.6.yml"

permissions:
  contents: write

concurrency:
  group: publish-5-0-6
  cancel-in-progress: false

jobs:
  publish:
    name: Commit source, verify APK, publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/publish-5.0.6.sh
