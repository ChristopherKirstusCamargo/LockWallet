name: Remove obsolete merged branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockwallet-obsolete-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only audited obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"

          # Each ref SHA was compared against main before this cleanup.
          # The three feature branches are ancestors of main. The release branch
          # contains only a superseded workflow that assembles an unsigned APK.
          while read -r branch expected_sha; do
            [[ -n "$branch" ]] || continue

            if ! actual_sha="$(gh api --jq '.object.sha' "repos/$repo/git/ref/heads/$branch" 2>/dev/null)"; then
              echo "Already absent: $branch"
              continue
            fi

            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Branch moved since audit; refusing to delete $branch"
              exit 1
            fi

            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
            echo "Deleted audited obsolete branch: $branch"
          done <<'EOF'
          feature/5.0.9-ci-validation 7bc88b3f1bfee96215dbece608782f76e51f4ade
          feature/5.0.9-final-review 1150e64e5f070e4b0bedff99a9e6f9fa27fa589b
          feature/5.0.9-ux-security ae313963196920355ee6adb4b930e426dc3f18fa
          release/5.0.10-build 7047bd1ddb94c27976cb23172a7f4c2decc905c9
          EOF

          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort)"
          if [[ "$remaining" != "main" ]]; then
            echo "::error::Unexpected branches remain after cleanup:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          echo "Verified: main is the only remaining branch."
