name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests, lint and manifest checks (no signing, no publishing)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # GitHub's Ubuntu 24.04 runner image already contains the Android SDK.
      # Do not use android-actions/setup-android here: it still requests the
      # removed legacy "tools" package on this runner image.
      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # The Actions runner ignores SIGPIPE: when sdkmanager stops
          # reading, `yes` gets EPIPE, prints "standard output: Broken
          # pipe" and exits 1, which pipefail would report as a failure
          # even though sdkmanager accepted every license and exited 0.
          # Judge sdkmanager's own exit status only: disable pipefail
          # for this one pipeline and keep `yes` quiet.
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run native bridge tests
        run: cargo test --locked --manifest-path native/privacy-ring/Cargo.toml --lib

      # Run 2 of this workflow failed before any task ran: Gradle could not download the pinned Kotlin
      # plugin (org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21) from Google/Maven Central/Plugin Portal,
      # while the same commit resolved from an empty cache elsewhere. Resolve plugins and dependencies first,
      # retrying transient network failures; hashes are still enforced by gradle/verification-metadata.xml.
      - name: Resolve Gradle plugins and dependencies (retries transient network errors)
        shell: bash
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace help; then exit 0; fi
            echo "Dependency resolution failed (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Run ciCheck (tests, architecture guards, lint, release manifest)
        shell: bash
        run: ./gradlew --no-daemon --stacktrace ciCheck
