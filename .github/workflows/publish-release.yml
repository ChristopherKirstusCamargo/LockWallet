name: Lock Wallet 5.0.1 signed release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lockwallet-release-v5.0.1
  cancel-in-progress: false

jobs:
  build-test-sign-publish:
    if: contains(github.event.head_commit.message, '[trigger-5.0.1-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: v5.0.1
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run full CI suite and compile Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ciCheck :app:assembleRelease

      - name: Verify Release manifest and version
        run: |
          python3 tools/verify_apk_manifest.py \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --release
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -F "versionCode='8' versionName='5.0.1'"

      - name: Preserve unsigned build for inspection
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/LockWallet-5.0.1-unsigned.apk
          (cd dist && sha256sum LockWallet-5.0.1-unsigned.apk > LockWallet-5.0.1-unsigned.apk.sha256)

      - name: Upload unsigned validation build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LockWallet-5.0.1-unsigned-validation
          path: |
            dist/LockWallet-5.0.1-unsigned.apk
            dist/LockWallet-5.0.1-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Sign APK and verify release certificate
        id: sign
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LOCKWALLET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing LOCKWALLET_KEYSTORE_PASSWORD Actions secret" >&2; exit 1; }
          KEYSTORE_CIPHERTEXT="$RUNNER_TEMP/lockwallet-release.p12.enc"
          KEYSTORE="$RUNNER_TEMP/lockwallet-release.p12"
          ALIGNED="$RUNNER_TEMP/lockwallet-aligned.apk"
          trap 'rm -f "$KEYSTORE" "$KEYSTORE_CIPHERTEXT" "$ALIGNED"' EXIT
          cp signing/lockwallet-release.p12.enc "$KEYSTORE_CIPHERTEXT"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass env:KEYSTORE_PASSWORD \
            -in "$KEYSTORE_CIPHERTEXT" \
            -out "$KEYSTORE"
          test -s "$KEYSTORE"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 dist/LockWallet-5.0.1-unsigned.apk "$RUNNER_TEMP/lockwallet-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias lockwallet \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/lockwallet.apk \
            "$RUNNER_TEMP/lockwallet-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/lockwallet.apk | grep -F "versionCode='8' versionName='5.0.1'"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 31 dist/lockwallet.apk | tee dist/apk-signature-verification.txt
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' dist/apk-signature-verification.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT_SHA256" = "ed4c0025c0b4d551fa95945c89d3d24e504349a2fab289ff90de66409fff8c13"
          keytool -exportcert -rfc \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias lockwallet \
            -file dist/lockwallet-signing-certificate.pem
          (cd dist && sha256sum lockwallet.apk > lockwallet.apk.sha256)
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(cut -d' ' -f1 dist/lockwallet.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath -q > "$RUNNER_TEMP/deps.txt"
          python3 tools/sbom.py "$RUNNER_TEMP/deps.txt" --version 5.0.1 --apk-sha256 "${{ steps.sign.outputs.apk_sha256 }}" -o dist/lockwallet.cdx.json
          cat > dist/RELEASE-NOTES.md <<EOF
          ## Lock Wallet 5.0.1

          Correções de segurança:
          - Lock Connect bloqueia transações dApp quando carteira + contas observadas excedem as 16 contas suportadas pela simulação, sem truncamento silencioso.
          - Android Keystore trata falhas ambíguas como indisponibilidade e evita quarentena indevida das carteiras.
          - Persistência solicita sincronização best-effort do diretório após renomeação atômica.
          - Testes automatizados de regressão incluídos.

          **SHA-256 do APK:** ${{ steps.sign.outputs.apk_sha256 }}
          **SHA-256 do certificado:** ${{ steps.sign.outputs.cert_sha256 }}

          **IMPORTANTE — migração da 5.0.0:** esta versão usa um novo certificado de assinatura. O Android não aceita instalá-la sobre a 5.0.0. Antes de desinstalar a versão anterior, faça backup e confirme que a frase de recuperação ou Recovery Package pode ser restaurado. Nunca desinstale a versão anterior antes de verificar o backup.
          EOF
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Lock Wallet 5.0.1" \
            --notes-file dist/RELEASE-NOTES.md \
            --latest \
            dist/lockwallet.apk \
            dist/lockwallet.apk.sha256 \
            dist/lockwallet-signing-certificate.pem \
            dist/apk-signature-verification.txt \
            dist/lockwallet.cdx.json
