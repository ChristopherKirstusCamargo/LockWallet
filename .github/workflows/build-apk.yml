name: Retired — signed release automation disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain retirement
        run: |
          echo "::error::Automated release signing and publishing are disabled."
          echo "Do not restore the release keystore or signing password to Git or GitHub Actions."
          exit 1
