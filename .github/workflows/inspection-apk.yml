name: Lock Wallet visual inspection APK

on:
  push:
    branches: [lockwallet-inspection-build]
    paths:
      - ".github/workflows/inspection-apk.yml"
      - "app/**"
      - "core/**"
      - "custody/**"
      - "data/**"
      - "native/**"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: read

concurrency:
  group: lockwallet-visual-inspection
  cancel-in-progress: true

jobs:
  build-inspection:
    name: Build isolated screenshot-enabled debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run native bridge tests
        run: cargo test --locked --manifest-path native/privacy-ring/Cargo.toml --lib

      - name: Run Android module and app tests, then build inspection APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :core:crypto:test \
            :core:solana:test \
            :data:rpc:test \
            :data:price:test \
            :custody:local:testDebugUnitTest \
            :custody:seedvault:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            -Plockwallet.testBuild=true \
            -Plockwallet.inspectionBuild=true

      - name: Verify package, signature and screenshot policy
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 31 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='com.lockwallet.app.test' versionCode='20' versionName='5.0.12'"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "application-label:'Lock Wallet'"
          mkdir -p dist
          cp "$APK" dist/LockWallet-5.0.12-visual-inspection-debug.apk
          sha256sum dist/LockWallet-5.0.12-visual-inspection-debug.apk > dist/LockWallet-5.0.12-visual-inspection-debug.apk.sha256

      - name: Upload inspection APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockWallet-5.0.12-visual-inspection-debug
          path: |
            dist/LockWallet-5.0.12-visual-inspection-debug.apk
            dist/LockWallet-5.0.12-visual-inspection-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
