name: Lock Wallet security build

on:
  push:
    branches:
      - security/audit-hardening-2026-11-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: lockwallet-security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify, compile and package unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify wrapper and run full project CI checks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ciCheck

      - name: Package and hash the unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" "dist/LockWallet-5.0.0-security-unsigned.apk"
          (
            cd dist
            sha256sum "LockWallet-5.0.0-security-unsigned.apk" > "LockWallet-5.0.0-security-unsigned.apk.sha256"
          )
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          cat "dist/LockWallet-5.0.0-security-unsigned.apk.sha256"

      - name: Upload APK and checksum as a validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LockWallet-5.0.0-security-unsigned
          path: |
            dist/LockWallet-5.0.0-security-unsigned.apk
            dist/LockWallet-5.0.0-security-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14
