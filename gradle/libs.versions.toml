# LOCK WALLET — pinned dependency catalog.
# Every version here is exact (no ranges, no "+"). Artifact hashes are enforced by
# gradle/verification-metadata.xml (Gradle dependency verification, sha256).
# Update policy: docs/adr/0014-cadeia-de-fornecimento-e-dependencias.md

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
# Crypto implementation (spec 6.4): Bouncy Castle lightweight API, no JCA provider lookup.
bouncycastle = "1.87"
composeBom = "2026.06.00" # newest BOM whose AARs accept compileSdk 36 + AGP 8.13 (2026.08.00 needs 37 + AGP 9.1)
activityCompose = "1.13.0"
coreKtx = "1.18.0" # 1.19.x needs compileSdk 37
biometric = "1.1.0" # latest stable (1.4.0 still rc)
fragment = "1.8.9"
zxing = "3.5.4" # QR encode + decode (pure Java, no network, no Play services)
seedvault = "0.4.0" # Solana Mobile Seed Vault wallet SDK (Phase G, ADR 0021)
mwaWalletlib = "2.1.1" # MWA 2.x wallet side; last line without kotlin-stdlib 2.4 (ADR 0022)
camerax = "1.5.2"
junit = "4.13.2"
gson = "2.15.0"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
seedvault-sdk = { module = "com.solanamobile:seedvault-wallet-sdk", version.ref = "seedvault" }
mwa-walletlib = { module = "com.solanamobile:mobile-wallet-adapter-walletlib", version.ref = "mwaWalletlib" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
junit = { module = "junit:junit", version.ref = "junit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
